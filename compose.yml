services:
 mct_web:
   build: .
   image: mct:latest
   entrypoint: /bin/sh
   env_file:
     - .env
   user: "${UID}:${GID}"
   ports:
     - "${HOST_PORT}:${CONTAINER_PORT}"
     - "${SERVER_HOST_PORT}:${SERVER_CONTAINER_PORT}"
   working_dir: /srv/app
   volumes:
     - type: bind
       source: ./
       target: /srv/app
   tty: true
