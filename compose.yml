services:
 mct_web:
   build: .
   image: mct:latest
   entrypoint: /bin/sh
   env_file:
     - .env
   user: "${UID}:${GID}"
   ports:
     - "${HOST_PORT}:${CONTAINER_PORT}"
     - "${SERVER_HOST_PORT}:${SERVER_CONTAINER_PORT}"
   working_dir: /srv/app
   volumes:
     - type: bind
       source: ./
       target: /srv/app
   tty: true
 cypress:
    image: cypress/included:15.9.0
    user: "${UID}:${GID}"
    profiles:
      - e2e
    depends_on:
      - mct_web
    environment:
      - NODE_NO_WARNINGS=1
    working_dir: /e2e
    volumes:
      - ./:/e2e
    network_mode: host
